<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>reservAR - tu lugar, tu momento.</title><meta name="theme-color" content="#6a11cb"><style>:root{--violeta:#6a11cb;--rosa:#ff5ab3;--mute:#cfc9e6;--stroke:#ffffff26}*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#fff;background:linear-gradient(160deg,#6a11cb,#3a0f6e 70%,#0a0933);background-attachment:fixed}.hidden{display:none!important}.wrap{max-width:1100px;margin:0 auto;padding:16px}.topbar{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;padding:14px 16px;background:rgba(31,7,54,.98);border-bottom:1px solid var(--stroke);backdrop-filter:blur(12px);min-height:64px}.logo{font-weight:900;white-space:nowrap;flex-shrink:0;display:flex;align-items:baseline;gap:8px;font-size:20px}.logo small{font-weight:400;color:#cfc9e6;font-size:13px}.tabs{display:flex;gap:10px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 2px 6px 2px;align-items:center}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--stroke);background:#ffffff12;color:#fff;padding:11px 20px;border-radius:999px;cursor:pointer;font-weight:700;white-space:nowrap;font-size:14px;flex:0 0 auto;min-height:42px;display:flex;align-items:center}.tab.active{background:#fff;color:#3a0f6e;box-shadow:0 2px 8px rgba(0,0,0,.2)}.right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}.btn{background:linear-gradient(135deg,#a855f7,#ff5ab3);border:none;color:#fff;padding:.6rem 1rem;border-radius:12px;cursor:pointer;font-weight:800}.btn.ghost{background:transparent;border:1px solid var(--stroke)}.btn.small{padding:.45rem .9rem;font-size:12px}.btn.full{width:100%}.auth{max-width:420px;margin:30px auto;background:#ffffff14;border:1px solid var(--stroke);border-radius:18px;padding:20px}.auth input{width:100%;padding:.7rem;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0a;color:#fff;margin-bottom:8px}.card{background:#ffffff10;border:1px solid var(--stroke);border-radius:16px;padding:16px;margin-bottom:12px}.list{list-style:none;padding:0;margin:0}.item{display:flex;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--stroke);border-radius:12px;background:#ffffff0d;margin-bottom:8px;align-items:flex-start;flex-wrap:wrap}input,select,textarea{width:100%;padding:.65rem;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}.screen{display:none}.screen.active{display:block}.pill{padding:5px 10px;border-radius:999px;border:1px solid var(--stroke);background:#ffffff18;font-size:11px;white-space:nowrap}.pill.ok{background:#22c55e33}.pill.warn{background:#f59e0b33}.pill.bad{background:#ef444433}.muted{color:#cfc9e6;font-size:12px}.error{color:#fca5a5;font-size:13px;min-height:16px}.note{color:#86efac;font-size:13px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-day{aspect-ratio:1;background:#ffffff0a;border:1px solid var(--stroke);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}.cal-day.has{background:#a855f733}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f0736;border:1px solid #ffffff33;padding:12px 18px;border-radius:12px;z-index:9999}.header-reservar{padding:14px 20px;text-align:center}body.app-mode .header-reservar{display:none!important}.detalle-grid{display:grid;gap:4px;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script></head><body><div class="header-reservar"><h1>reservAR <span style="font-weight:300;color:#cfc9e6;font-size:14px">tu lugar, tu momento.</span></h1></div><section id="auth" class="auth"><h2>Iniciar sesión</h2><input id="email" type="email" placeholder="tu@correo.com"><input id="password" type="password" placeholder="Contraseña"><p id="loginMsg" class="error"></p><button id="loginBtn" class="btn full">Entrar</button><p class="muted" style="text-align:center;margin-top:10px"><a href="#" id="goRegister" style="color:#ff5ab3">Crear cuenta</a>

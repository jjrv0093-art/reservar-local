<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReservAR - Panel Local vFinal Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:#f5f0ff;color:#1a1a1a}
header{background:linear-gradient(135deg,#1a0033,#4a0080);color:white;padding:16px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.tab{padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:white;cursor:pointer;margin:3px}
.tab.active{background:white;color:#4a0080;font-weight:800}
.card{background:white;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #eee}
.btn{padding:11px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:700}
.btn.primary{background:#7c3aed;color:white}.btn.ghost{background:#f3f0ff;color:#5b21b6}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.pill{background:#f3f0ff;color:#6d28d9;padding:4px 10px;border-radius:20px;font-weight:700;font-size:0.85rem}
input{padding:12px;border-radius:10px;border:1px solid #ddd;width:100%;margin-top:6px}
.screen{display:none}.screen.active{display:block}
.notice{font-size:0.85rem;color:#666;margin-top:8px}
#statusFirebase{padding:8px 12px;border-radius:10px;font-size:0.8rem;margin-top:8px;display:inline-block}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.grid{display:grid;gap:14px}.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.badgeOnline{padding:6px 12px;border-radius:20px;font-weight:800;font-size:0.8rem}.on{background:#dcfce7;color:#166534}.off{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header>
<div class="wrap" style="padding:0">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<b>ReservAR · Panel Local · reservar-cb70d</b>
<span id="badgeEstado" class="badgeOnline off">Cargando...</span>
</div>
<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
<button class="btn primary" id="btnToggleOnline">Activar reservas online</button>
<div id="statusFirebase" class="err">Conectando a Firebase...</div>
</div>
<nav style="margin-top:14px">
<button class="tab active" data-screen="inicio">Inicio</button>
<button class="tab" data-screen="reservas">Reservas</button>
<button class="tab" data-screen="servicios">Servicios</button>
<button class="tab" data-screen="calendario">Calendario</button>
<button class="tab" data-screen="clientes">Clientes</button>
<button class="tab" data-screen="facturacion">Facturación</button>
</nav>
</div>
</header>
<main class="wrap">
<section id="inicio" class="screen active">
<div class="grid cols-3">
<div class="card"><h3>Reservas hoy</h3><div class="item"><span>Total</span><span class="pill" id="kHoy">0</span></div><p class="notice">Tiempo real desde Firebase</p></div>
<div class="card"><h3>Ingresos mes</h3><div class="item"><span>Estimado</span><span class="pill" id="kIngresos">$0</span></div></div>

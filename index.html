<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>reservAR</title>
<style>
:root{--stroke:#ffffff26}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;color:#fff;background:linear-gradient(160deg,#6a11cb,#7b1fa2 40%,#3a0f6e 70%,#0a0933);background-attachment:fixed}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:rgba(31,7,54,.98);border-bottom:1px solid var(--stroke)}
.topbar-main{display:flex;justify-content:space-between;align-items:center;width:100%}
.logo{font-weight:900;font-size:18px}
.right{display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:10px;overflow-x:auto;width:100%;padding:6px 2px 8px}
.tab{border:1px solid var(--stroke);background:#ffffff12;color:#fff;padding:12px 20px;border-radius:999px;cursor:pointer;font-weight:700;white-space:nowrap;font-size:14px;min-height:44px;display:flex;align-items:center}
.tab.active{background:#fff;color:#3a0f6e}
.btn{background:#a855f7;border:none;color:#fff;padding:.6rem.9rem;border-radius:10px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--stroke)}
.btn.full{width:100%}
.btn.small{padding:.35rem.6rem;font-size:12px}
.auth{max-width:420px;margin:30px auto;background:#ffffff12;border:1px solid var(--stroke);border-radius:14px;padding:16px}
.auth input{width:100%;padding:.6rem.7rem;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:#fff;margin-bottom:8px}
.screen{display:none}
.screen.active{display:block}
.card{background:#ffffff12;border:1px solid var(--stroke);border-radius:16px;padding:16px;margin-bottom:12px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--stroke);border-radius:12px;background:#ffffff0f;margin-bottom:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;padding:.6rem.7rem;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:#fff}
.pill{padding:6px 10px;border-radius:999px;border:1px solid var(--stroke);background:#ffffff18;font-size:12px}
.pill.conectado{background:#22c55e33;color:#86efac;border-color:#22c55e;font-weight:800}
.pill.desconectado{background:#ef444433;color:#fca5a5;border-color:#ef4444;font-weight:800}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f0736;border:1px solid #ffffff33;padding:10px 16px;border-radius:12px;z-index:9999}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal-day{padding:10px;border-radius:10px;border:1px solid var(--stroke);text-align:center;cursor:pointer;background:#ffffff0f}
.cal-day.hoy{background:#fff;color:#3a0f6e;font-weight:900}
.cal-day.ocupado{background:#ef444433;border-color:#ef4444}
.aviso{padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid #fca5a5;background:#ef444422}
.svc-img{width:54px;height:54px;border-radius:10px;object-fit:cover;border:1px solid #a855f7}
.file-input{display:none}
.file-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#a855f7;color:#fff;padding:12px;border-radius:10px;font-weight:800;cursor:pointer;border:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>
<div style="padding:20px"><h1 style="margin:0;font-size:21px">reservAR<span style="font-weight:300;font-size:15px;color:#cfc9e6"> tu lugar, tu momento.</span></h1></div>
<section id="auth" class="auth"><h2>Iniciar sesión</h2><input id="email" type="email" placeholder="tu@correo.com"><input id="password" type="password" placeholder="Contraseña"><p id="loginMsg" style="color:#fca5a5"></p><button id="loginBtn" class="btn full">Entrar</button><p style="text-align:center"><a href="#" id="goForgot" style="color:#cfc9e6;font-size:13px">¿Olvidaste tu contraseña?</a></p><p style="text-align:center;margin-top:14px">¿No tenés cuenta? <a href="#" id="goRegister" style="color:#ff5ab3">Crear cuenta</a></p></section>
<section id="register" class="auth hidden"><h2>Crear cuenta</h2><input id="regNombre" placeholder="Nombre"><input id="regApellido" placeholder="Apellido"><input id="regEmail" type="email" placeholder="Correo"><input id="regPass" type="password" placeholder="Contraseña"><input id="regPass2" type="password" placeholder="Repetir"><label style="font-size:13px"><input id="regTerminos" type="checkbox" style="width:auto"> Acepto términos</label><p id="regMsg" style="color:#fca5a5"></p><button id="registerBtn" class="btn full">Registrarme</button><p style="text-align:center;margin-top:14px"><a href="#" id="goLogin" style="color:#ff5ab3">Iniciar sesión</a></p></section>
<section id="forgot" class="auth hidden"><h2>Recuperar</h2><input id="forgotEmail" type="email" placeholder="tu correo"><p id="forgotMsg" style="color:#fca5a5"></p><p id="forgotOk" style="color:#86efac"></p><button id="forgotBtn" class="btn full">Enviar link</button><p style="text-align:center;margin-top:14px"><a href="#" id="goBackLogin" style="color:#ff5ab3">Volver</a></p></section>
<section id="app" class="hidden">
<div class="topbar"><div class="topbar-main"><div class="logo">reservAR</div><div class="right"><span id="estadoPill" class="pill conectado">Conectado</span><button id="btnToggleEstado" class="btn small">Pausar</button><button id="btnLogout" class="btn small ghost">Salir</button></div></div><div class="tabs"><button class="tab active" data-screen="dashboard">Inicio</button><button class="tab" data-screen="reservas">Reservas</button><button class="tab" data-screen="calendario">Calendario</button><button class="tab" data-screen="servicios">Servicios</button><button class="tab" data-screen="soporte">Soporte</button></div></div>
<div class="wrap">
<section id="dashboard" class="screen active"><div class="card"><h2 id="saludo">Panel</h2><div class="row"><button id="btnNuevaReserva" class="btn">+ Nueva reserva</button><button id="btnIrReservas" class="btn ghost">Ver reservas</button></div><div id="kpis" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="card"><h3>Turnos de hoy</h3><ul id="turnosHoy" class="list"></ul></div></section>
<section id="reservas" class="screen"><div id="cardNuevaReserva" class="card"><h3 id="tituloReserva">Nueva reserva</h3><form id="reservaForm" class="formgrid"><div><label>Cliente *</label><input id="rCliente" required></div><div><label>WhatsApp</label><input id="rWhats"></div><div><label>Servicio</label><select id="rServicioSelect"></select></div><div><label>Precio $</label><input id="rPrecio" type="number"></div><div><label>Duración min</label><input id="rDur" type="number" value="60"></div><div><label>Fecha y hora</label><input id="rFechaHora" type="datetime-local" required></div><div><label>Estado</label><select id="rEstado"><option value="pendiente">Pendiente</option><option value="confirmada" selected>Confirmada</option><option value="cancelada">Cancelada</option></select></div><div><label>Origen</label><select id="rOrigen"><option value="local">Local</option><option value="cliente">Cliente</option></select></div><div><label>Comentario</label><textarea id="rComentario"></textarea></div><div class="row"><button type="submit" class="btn">Guardar</button></div></form></div><div id="cardListaReservas" class="card hidden"><h3>Reservas</h3><ul id="listaReservas" class="list"></ul></div></section>
<section id="calendario" class="screen"><div class="card"><div style="display:flex;justify-content:space-between"><button id="calPrev" class="btn small ghost"><</button><h3 id="calTitulo"></h3><button id="calNext" class="btn small ghost">></button></div><div id="calendar" class="cal-grid"></div></div></section>
<section id="servicios" class="screen"><div class="card"><h3>Servicios</h3><div class="formgrid"><div><input id="svcName" placeholder="Nombre *"></div><div><input id="svcPrice" type="number" placeholder="Precio *"></div><div><input id="svcDur" type="number" value="60"></div><div><input id="svcCupo" type="number" value="1" min="1" max="20"></div><div><label style="color:#a855f7;font-weight:700">Foto del servicio</label><input id="svcFoto" type="file" accept="image/*" class="file-input"><label for="svcFoto" class="file-btn">Seleccionar foto</label><img id="svcFotoPrev" class="hidden" style="width:100%;max-width:200px;border-radius:10px;margin-top:8px;border:1px solid #a855f7"></div></div><div class="row" style="margin-top:8px"><button id="btnAddService" class="btn">Agregar servicio</button><button id="btnCancelEditSvc" class="btn ghost hidden">Cancelar</button></div><ul id="serviceList" class="list" style="margin-top:12px"></ul></div></section>
<section id="soporte" class="screen"><div class="card" style="border-color:#a855f7"><h3 style="color:#a855f7">Soporte</h3><div class="formgrid"><div><label>Tipo</label><select id="sopTipoLocal"><option value="consulta">Consulta</option><option value="problema">Problema</option></select></div><div><label>Comentario</label><textarea id="sopComentarioLocal"></textarea></div><div><label style="color:#a855f7;font-weight:700">Archivo</label><input id="sopArchivoLocal" type="file" accept="image/*" class="file-input"><label for="sopArchivoLocal" class="file-btn">Archivo</label><div id="sopPrev"></div></div></div><button id="btnEnviarSoporteLocal" class="btn full" style="margin-top:8px">Enviar a soporte</button><p id="sopLocalMsg" style="color:#86efac"></p></div></section>
</div></section><div id="toast" class="toast hidden"></div>
<script>
const fb={apiKey:"AIzaSyD8o4eR9k0g8o6d5o4eR9k0g8o6d5o",authDomain:"reservar-cb70d.firebaseapp.com",projectId:"reservar-cb70d",storageBucket:"reservar-cb70d.firebasestorage.app",messagingSenderId:"123456789012",appId:"1:123456789012:web:abcd1234efgh5678ijkl"};
firebase.initializeApp(fb);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
const $$=s=>document.querySelectorAll(s);
function safe(id,ev,fn){const el=$(id);if(el)el.addEventListener(ev,fn)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function goScreen(n){$$('.screen').forEach(s=>s.classList.remove('active'));const t=$(n);if(t)t.classList.add('active');$$('.tab').forEach(x=>{x.classList.toggle('active',x.dataset.screen===n)});}
function comprimirImagen(file,maxW=800,quality=0.6){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width;let h=img.height;if(w>maxW){h=(maxW/w)*h;w=maxW;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=e.target.result;};r.onerror=reject;r.readAsDataURL(file);});}
let currentConfig=null;let allReservas=[];let serviciosCache={};let editId=null;let editSvcId=null;let calDate=new Date();let svcFotoBase64='';let sopFileBase64='';let authReady=false;let domReady=false;
function tryInit(){if(authReady&&domReady)initPanel()}
document.addEventListener('DOMContentLoaded',()=>{domReady=true;tryInit();setupInputs()});
auth.onAuthStateChanged(async u=>{if(!u){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');authReady=true;tryInit()});
function setupInputs(){
safe('svcFoto','change',async e=>{const f=e.target.files[0];if(!f)return;const c=await comprimirImagen(f,600,0.6);svcFotoBase64=c;$('svcFotoPrev').src=c;$('svcFotoPrev').classList.remove('hidden')});
safe('sopArchivoLocal','change',async e=>{const f=e.target.files[0];if(!f)return;const c=await comprimirImagen(f,800,0.6);sopFileBase64=c;$('sopPrev').innerHTML=`<img src="${c}" style="width:100%;max-width:200px;border-radius:10px;margin-top:8px">`});
safe('loginBtn','click',async()=>{try{await auth.signInWithEmailAndPassword($('email').value,$('password').value)}catch(e){$('loginMsg').textContent=e.message}});
safe('registerBtn','click',async()=>{try{const c=await auth.createUserWithEmailAndPassword($('regEmail').value,$('regPass').value);await db.collection('config').doc(c.user.uid).set({localNombre:$('regNombre').value+' '+$('regApellido').value,email:$('regEmail').value,plan:'basico',visible:true,ts:Date.now()},{merge:true})}catch(e){$('regMsg').textContent=e.message}});
safe('forgotBtn','click',async()=>{try{await auth.sendPasswordResetEmail($('forgotEmail').value);$('forgotOk').textContent='Enviado'}catch(e){$('forgotMsg').textContent=e.message}});
safe('goRegister','click',e=>{e.preventDefault();$('auth').classList.add('hidden');$('register').classList.remove('hidden')});
safe('goLogin','click',e=>{e.preventDefault();$('register').classList.add('hidden');$('auth').classList.remove('hidden')});
safe('goForgot','click',e=>{e.preventDefault();$('auth').classList.add('hidden');$('forgot').classList.remove('hidden')});
safe('goBackLogin','click',e=>{e.preventDefault();$('forgot').classList.add('hidden');$('auth').classList.remove('hidden')});
safe('btnLogout','click',()=>auth.signOut());
}
async function initPanel(){await cargarTodo();}
async function cargarTodo(){const uid=auth.currentUser.uid;await cargarServicios();try{const doc=await db.collection('config').doc(uid).get();if(doc.exists){currentConfig=doc.data();}}catch(e){}await cargarReservas();}
async function cargarServicios(){const uid=auth.currentUser.uid;const sel=$('rServicioSelect');if(sel)sel.innerHTML='<option value="">Servicio</option>';const list=$('serviceList');if(list)list.innerHTML='';try{const snap=await db.collection('config').doc(uid).collection('servicios').get();serviciosCache={};snap.forEach(doc=>{const d=doc.data();serviciosCache[doc.id]=d;if(sel){const o=document.createElement('option');o.value=d.nombre;o.textContent=`${d.nombre} $${d.precio}`;sel.appendChild(o)}if(list){const li=document.createElement('li');li.className='item';li.innerHTML=`<div style="display:flex;gap:8px;align-items:center">${d.foto?`<img src="${d.foto}" class="svc-img">`:''}<div><b>${d.nombre}</b><div style="font-size:11px">$${d.precio}</div></div></div><div><button class="btn small ghost" data-del="${doc.id}">X</button></div>`;list.appendChild(li)}});}catch(e){}}
async function cargarReservas(){const uid=auth.currentUser.uid;allReservas=[];try{const snap=await db.collection('reservas').where('uidLocal','==',uid).limit(250).get();snap.forEach(d=>{allReservas.push({id:d.id,...d.data()})})}catch(e){}renderReservas(allReservas);renderKPIs();renderCalendario();}
function renderKPIs(){const hoy=new Date().toISOString().split('T')[0];const hoyRes=allReservas.filter(r=>(r.fecha||'').includes(hoy));if($('kpis'))$('kpis').innerHTML=`<span class="pill">Hoy ${hoyRes.length}</span><span class="pill">Total ${allReservas.length}</span>`;const ul=$('turnosHoy');if(!ul)return;ul.innerHTML='';hoyRes.slice(0,12).forEach(r=>{const li=document.createElement('li');li.className='item';li.innerHTML=`<div><b>${r.cliente||''}</b> ${r.servicio||''}</div>`;ul.appendChild(li)});}
function renderReservas(list){const ul=$('listaReservas');if(!ul)return;ul.innerHTML='';list.forEach(r=>{const li=document.createElement('li');li.className='item';li.innerHTML=`<div><b>${r.cliente||''}</b></div>`;ul.appendChild(li)});}
function renderCalendario(){const cont=$('calendar');const tit=$('calTitulo');if(!cont)return;cont.innerHTML='';const y=calDate.getFullYear(),m=calDate.getMonth();if(tit)tit.textContent=new Date(y,m,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});const first=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const d=document.createElement('div');cont.appendChild(d)}for(let d=1;d<=days;d++){const div=document.createElement('div');div.className='cal-day';div.textContent=d;cont.appendChild(div)}}
$$('.tab').forEach(t=>{t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');goScreen(t.dataset.screen)})});
safe('btnNuevaReserva','click',()=>{goScreen('reservas');$('cardNuevaReserva').classList.remove('hidden');$('cardListaReservas').classList.add('hidden')});
safe('btnIrReservas','click',()=>{goScreen('reservas');$('cardListaReservas').classList.remove('hidden');$('cardNuevaReserva').classList.add('hidden')});
safe('btnToggleEstado','click',async()=>{const uid=auth.currentUser.uid;const d=await db.collection('config').doc(uid).get();const cur=d.data()?.reservasPausadas===true;await db.collection('config').doc(uid).set({reservasPausadas:!cur},{merge:true});toast(!cur?'Desconectado':'Conectado')});
safe('btnEnviarSoporteLocal','click',async()=>{
const uid=auth.currentUser.uid;
const tipo=$('sopTipoLocal').value;
const com=$('sopComentarioLocal').value.trim();
if(!com){toast('Comentario');return}
const idReserva='res_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
const fechaHoraIso=new Date().toISOString();
const datosReservaCompleto={idReserva:idReserva,uidLocal:uid,fecha:fechaHoraIso,producto:{nombre:tipo,precio:0,imagen:sopFileBase64||''},clienteData:{uid:uid,origen:'local'}};
await db.collection('soporte').add({origen:'local',uidLocal:uid,idReserva:idReserva,fecha:fechaHoraIso,fechaHoraProblema:fechaHoraIso,mensaje:com,tipo,imagen:sopFileBase64||'',datosReservaCompleto:datosReservaCompleto,ts:Date.now()});
toast('Enviado');$('sopComentarioLocal').value='';sopFileBase64='';$('sopPrev').innerHTML='';
});
safe('reservaForm','submit',async e=>{
e.preventDefault();
const uid=auth.currentUser.uid;
const fh=$('rFechaHora').value;
const data={uidLocal:uid,cliente:$('rCliente').value,whatsapp:$('rWhats').value,servicio:$('rServicioSelect').value,precio:Number($('rPrecio').value||0),duracion:Number($('rDur').value||60),fecha:fh.split('T')[0],hora:fh.split('T')[1]||'',fechaHora:fh,estado:$('rEstado').value,origen:$('rOrigen').value,comentario:$('rComentario').value,ts:Date.now()};
await db.collection('reservas').add(data);
toast('Guardada');$('reservaForm').reset();cargarReservas()
});
safe('btnAddService','click',async()=>{
const uid=auth.currentUser.uid;
const nombre=$('svcName').value.trim();
const precio=Number($('svcPrice').value||0);
if(!nombre||!precio){toast('Nombre y precio');return}
const payload={nombre:nombre,precio:precio,duracion:Number($('svcDur').value||60),cupo:Number($('svcCupo').value||1),foto:svcFotoBase64||'',uidLocal:uid,ts:Date.now()};
const ref=await db.collection('config').doc(uid).collection('servicios').add(payload);
await db.collection('catalogo').doc(ref.id).set({id:ref.id,nombre:nombre,precio:precio,categoria:'Servicios',imagen:svcFotoBase64||'',uidLocal:uid,origen:'local',ts:Date.now()},{merge:true});
$('svcName').value='';$('svcPrice').value='';svcFotoBase64='';if($('svcFotoPrev'))$('svcFotoPrev').classList.add('hidden');toast('Servicio guardado');cargarServicios();
});
</script>
</body>
</html>
